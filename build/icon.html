<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 256px;
        height: 256px;
        overflow: hidden;
      }
      .tile {
        width: 256px;
        height: 256px;
        background: radial-gradient(circle at 30% 25%, #2a231c 0%, #14100c 70%);
        border-radius: 44px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 6px solid #c9a24b;
      }
      .diamond {
        position: absolute;
        width: 168px;
        height: 168px;
        transform: rotate(45deg);
        border: 5px solid #a61e22;
      }
      .txt {
        font-family: Bahnschrift, 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 78px;
        letter-spacing: 2px;
        color: #c9a24b;
        z-index: 1;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="diamond"></div>
      <div class="txt">PKH</div>
    </div>
  </body>
</html>
